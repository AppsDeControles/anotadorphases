<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anotador de Juegos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Plan: libreta de anotar sobre mesa de fieltro. Una columna angosta para celular,
   totales en números grandes tipo marcador, verde fieltro para acciones y
   amarillo ficha solo para quien va ganando. */
:root{
  --bg:#edf1ec; --surface:#ffffff; --ink:#14261d; --muted:#5b6d63; --line:#d2dbd4;
  --felt:#1d6a49; --felt-ink:#ffffff; --lead:#f0b429; --lead-ink:#3a2a00; --bad:#b3372b;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1b15; --surface:#16271f; --ink:#e9f0ea; --muted:#93a69b; --line:#294135;
    --felt:#43b281; --felt-ink:#06140d; --lead:#f0b429; --lead-ink:#2c2000; --bad:#f08273;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1b15; --surface:#16271f; --ink:#e9f0ea; --muted:#93a69b; --line:#294135;
  --felt:#43b281; --felt-ink:#06140d; --lead:#f0b429; --lead-ink:#2c2000; --bad:#f08273;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lead);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding:16px 16px 96px;display:flex;flex-direction:column;gap:16px}

.top{display:flex;align-items:center;gap:12px}
.top svg{flex:none}
.top h1{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.01em;margin:0;line-height:1;text-transform:uppercase}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font-weight:600;color:var(--muted)}
.tabs button[aria-current="true"]{background:var(--felt);color:var(--felt-ink)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:600;min-height:48px}
.btn.primary{background:var(--felt);color:var(--felt-ink);border-color:var(--felt)}
.btn.big{width:100%;font-size:18px;padding:16px}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.btn.small{min-height:40px;padding:8px 12px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > .grow{flex:1}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:700}
.muted{color:var(--muted);font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.lead{background:var(--lead);border-color:var(--lead);color:var(--lead-ink)}
.tag.live{border-color:var(--felt);color:var(--felt)}

.list{display:flex;flex-direction:column;gap:8px}
.game{display:flex;gap:8px;align-items:stretch}
.game .open{flex:1;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.game .open strong{font-size:17px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.game .del{border:1px solid var(--line);background:var(--surface);border-radius:14px;width:48px;color:var(--bad);font-size:20px}

.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:14px;font-weight:600}
input[type=text]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px;min-height:48px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 14px;font-weight:600;min-height:42px}
.chip[aria-pressed="true"]{background:var(--felt);border-color:var(--felt);color:var(--felt-ink)}
.chip .n{font-family:var(--display);margin-right:6px}

.banner{background:var(--lead);color:var(--lead-ink);border-radius:16px;padding:14px 16px;font-weight:700;font-size:18px}
.stand{display:flex;flex-direction:column}
.p{display:grid;grid-template-columns:28px 1fr auto;gap:4px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.p:first-child{border-top:0;padding-top:0}
.p:last-child{padding-bottom:0}
.p .pos{font-family:var(--display);font-size:22px;color:var(--muted);font-weight:600}
.p .who{min-width:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600;font-size:18px;overflow-wrap:anywhere}
.p .tot{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.p .bar{grid-column:2 / 4;height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.p .bar i{display:block;height:100%;background:var(--felt);border-radius:3px}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:700}
th:first-child,td:first-child{text-align:left}
td small{display:block;color:var(--muted);font-size:11px}
tfoot td{font-weight:700;border-bottom:0}
td .edit{border:0;background:none;color:var(--felt);font-weight:700;padding:4px 0;text-decoration:underline}
.neg{color:var(--bad)}

.veil{position:fixed;inset:0;background:rgba(5,15,10,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px 20px;display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font-family:var(--display);font-size:28px;text-transform:uppercase;line-height:1}
.entry{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.entry .nm{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.entry .in{display:flex;gap:6px;align-items:center}
.entry input[type=text]{width:92px;text-align:right;font-family:var(--display);font-size:26px;font-weight:800;padding:6px 10px}
.entry .pm{width:44px;height:48px;border:1px solid var(--line);background:var(--bg);border-radius:10px;font-weight:700;font-size:18px}
.entry .mini{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted);gap:2px}
.entry .mini input[type=text]{width:68px}
.check{grid-column:1 / 3;display:flex;gap:10px;align-items:center;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--felt)}
.rowcheck{padding:6px 0 14px;border-bottom:1px solid var(--line);min-height:48px;flex-wrap:wrap}
.rowcheck input{width:28px;height:28px}
.tag.tok{display:inline-flex;align-items:center;gap:5px;color:var(--ink);border-color:var(--ink)}
.p .tot small{display:block;font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;margin-bottom:2px}
.p .req{grid-column:2 / 4;color:var(--muted);font-size:14px;margin-top:-2px}
.phl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.phl li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.phl li:first-child{border-top:0}
.phl b{font-family:var(--display);font-size:22px;width:24px;color:var(--muted);flex:none}
.phl span{flex:1;font-weight:600}
.ro [data-act]:not([data-act="go"]):not([data-act="open"]),.ro form[data-form],.ro .acts,.ro .card .row{display:none !important}
a.btn{display:block;text-align:center;text-decoration:none;color:inherit}
a.btn.wa{border-color:var(--felt);color:var(--felt)}
.mine{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05;text-transform:uppercase}
.center{align-items:center}
.center .sheet{border-radius:20px;margin:16px}
@media (prefers-reduced-motion:no-preference){ .sheet{animation:up .18s ease-out} @keyframes up{from{transform:translateY(16px)}to{transform:none}} }
</style>
</head>
<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ====== PEGA AQUÍ LA CONFIGURACIÓN DE TU PROYECTO DE FIREBASE ======
   Debe incluir databaseURL. Mientras esté vacía, el anotador funciona
   solo en este celular y no se puede compartir. */
var firebaseConfig = {
  apiKey: "AIzaSyDndVJIPwxXsjto--w3mEOESa8t9olC4mQ",
  authDomain: "anotador-phases.firebaseapp.com",
  databaseURL: "https://anotador-phases-default-rtdb.firebaseio.com",
  projectId: "anotador-phases",
  storageBucket: "anotador-phases.firebasestorage.app",
  messagingSenderId: "992057105054",
  appId: "1:992057105054:web:fcc04d330acd7cd67d398f"
};
</script>
<script>
(function(){
var KEY='anotador-juegos-v1';
var PRESETS=[
 {id:'domino',name:'Dominó',win:'high',target:100,note:'Se suma por mano. Termina cuando alguien llega a la meta.'},
 {id:'phase10',name:'Phase 10',win:'low',target:null,phases:true,note:'Solo se marca quién avanza de fase en cada ronda, sin sumar puntos. Una ficha indica quién tiene la mano y una baraja quién reparte. Gana quien termina primero la fase 10.'},
 {id:'uno',name:'Uno',win:'high',target:500,note:'Quien gana la mano suma las cartas de los demás. Termina al llegar a la meta.'},
 {id:'rummy',name:'Rummy / Continental',win:'low',target:null,note:'Se anota lo que te quedó en la mano. Gana el de menos puntos.'},
 {id:'hearts',name:'Corazones',win:'low',target:100,note:'Termina cuando alguien llega a la meta. Gana el de menos puntos.'},
 {id:'diezmil',name:'10,000',win:'high',target:10000,note:'Dados acumulados hasta la meta.'},
 {id:'bet',name:'Wizard / Podrida',win:'high',target:null,bet:true,note:'Cada quien apuesta sus bazas. Si acierta: 20 + 10 por baza. Si falla: −10 por cada baza de diferencia.'},
 {id:'libre',name:'Otro juego',win:'high',target:null,note:'Tú decides cómo se gana y si hay meta.'}
];
var ORIG=['2 tercias','1 tercia + corrida de 4','4 iguales + corrida de 4','Corrida de 7','Corrida de 8','Corrida de 9','2 grupos de 4 iguales','7 cartas de un color','5 iguales + 1 par','5 iguales + 1 tercia'];
var ALT=[
 ['1 tercia + 2 pares','4 pares','Corrida de 4 + 1 par','6 cartas de un color'],
 ['Corrida de 5 + 1 par','1 tercia + 4 cartas de un color','5 cartas de un color + 1 par','2 tercias + 1 par'],
 ['1 tercia + corrida de 5','2 corridas de 4','4 iguales + 4 cartas de un color','4 iguales + 2 pares'],
 ['Corrida de 6 + 1 par','7 cartas pares o 7 impares','Corrida de 4 de un mismo color','3 tercias'],
 ['Corrida de 7 + 1 par','8 cartas pares u 8 impares','Corrida de 6 + 1 tercia','5 pares'],
 ['Corrida de 8 + 1 par','Corrida de 5 de un mismo color','4 iguales + corrida de 5','2 corridas de 5'],
 ['4 iguales + 2 tercias','2 grupos de 4 iguales + 1 par','Corrida de 6 + 4 iguales','4 iguales + 5 cartas de un color'],
 ['8 cartas de un color','1 tercia + 6 cartas de un color','Corrida de 6 de un mismo color','9 cartas pares o 9 impares'],
 ['5 iguales + corrida de 4','5 iguales + 2 pares','5 iguales + 4 cartas de un color','Corrida de 10'],
 ['5 iguales + corrida de 5','2 grupos de 5 iguales','6 iguales + 1 tercia','9 cartas de un color']
];
function phases(g){return g.pset||ORIG}
function pick(lv,avoid){var o=ALT[lv].filter(function(x){return x!==avoid});return o[Math.floor(Math.random()*o.length)]}
function newSet(old){return ALT.map(function(_,k){return pick(k,old?old[k]:null)})}
var S, V={screen:'home',gameId:null,draft:null,sheet:null,confirm:null};

function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n){return (n<0?'−':'')+Math.abs(n).toLocaleString('es-MX')}
function num(v){var n=parseInt(String(v).replace(/[^\d-]/g,''),10);return isNaN(n)?0:n}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.players&&o.games)return o}}catch(e){}return null}
var RO=false,MODE='boot',DB=null,UID=null,SYNC='',VIEW=null,ME=null,pushed={},busy={},again={};
var FBOK=!!(window.firebase&&window.firebaseConfig&&firebaseConfig.apiKey&&firebaseConfig.databaseURL);
function save(){
  if(RO)return;
  delete S.seed;S.t=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  syncAll();
}
function payload(g){var c=JSON.parse(JSON.stringify(g));c.players.forEach(function(p){p.name=pname(g,p.id)});return JSON.stringify(c)}
function syncAll(){
  if(MODE!=='owner')return;
  var seen={};
  S.games.forEach(function(g){seen[g.id]=1;if(!g.example)pushGame(g.id)});
  Object.keys(pushed).forEach(function(id){if(!seen[id]){delete pushed[id];DB.ref('partidas/'+id).remove().catch(function(){})}});
}
function pushGame(id){
  var g=S.games.find(function(x){return x.id===id});if(!g)return;
  var str=payload(g);
  if(pushed[id]===str)return;
  if(busy[id]){again[id]=1;return}
  busy[id]=1;SYNC='saving';paintSync();
  DB.ref('partidas/'+id).set({owner:UID,t:Date.now(),data:str}).then(function(){pushed[id]=str;SYNC='ok'},function(){SYNC='err'}).then(function(){
    busy[id]=0;
    if(again[id]){again[id]=0;pushGame(id)}else paintSync();
  });
}
function syncText(){
  if(MODE==='viewer')return SYNC==='live'?'Modo vista · se actualiza solo':SYNC==='slow'?'Aún no se puede cargar la partida. Sigo intentando…':SYNC==='err'?'No se pudo conectar con la partida. Cierra y vuelve a abrir el enlace.':'Conectando con la partida…';
  if(MODE==='owner')return SYNC==='saving'?'Guardando en la nube…':SYNC==='err'?'No se pudo guardar en la nube. Queda guardado en este celular.':'Tú anotas · los jugadores lo ven con su enlace';
  return '';
}
function paintSync(){var el=document.getElementById('sync');if(el)el.textContent=syncText()}
function pstats(p){
  var pl=0,wn=0;
  S.games.forEach(function(g){if(g.players.some(function(q){return q.id===p.id})){pl++;if(isOver(g)&&standing(g).some(function(r){return r.id===p.id&&r.pos===1}))wn++}});
  return pl+(pl===1?' partida':' partidas')+' · '+wn+(wn===1?' ganada':' ganadas');
}
function connect(){
  var q=new URLSearchParams(location.search),v=q.get('v'),me=q.get('j'),okId=/^[A-Za-z0-9_-]{5,40}$/;
  if(v){
    VIEW=okId.test(v)?v:'x';ME=me&&okId.test(me)?me:null;
    MODE='viewer';RO=true;S=null;render();
    if(!FBOK||VIEW==='x'){SYNC='err';S={players:[],games:[]};render();return}
    firebase.initializeApp(firebaseConfig);DB=firebase.database();
    var timer=setTimeout(function(){if(SYNC!=='live'){SYNC='slow';paintSync()}},10000);
    DB.ref('partidas/'+VIEW+'/data').on('value',function(snap){
      clearTimeout(timer);SYNC='live';
      var g=null;try{g=JSON.parse(snap.val())}catch(e){}
      if(g&&Array.isArray(g.players)&&g.players.length&&Array.isArray(g.rounds)){g.id=VIEW;S={players:[],games:[g]};V.gameId=VIEW;V.screen='game'}
      else{S={players:[],games:[]};V.screen='home'}
      render();
    },function(){clearTimeout(timer);SYNC='err';if(!S)S={players:[],games:[]};render()});
    return;
  }
  if(!S){S=seed();S.seed=true}
  MODE='local';render();
  if(!FBOK)return;
  firebase.initializeApp(firebaseConfig);DB=firebase.database();
  firebase.auth().onAuthStateChanged(function(u){
    if(!u)return;
    UID=u.uid;MODE='owner';SYNC='ok';syncAll();
    if(!V.sheet&&!V.confirm&&V.screen!=='new')render();else paintSync();
  });
  firebase.auth().signInAnonymously().catch(function(){});
}
function seed(){
  var a={id:uid(),name:'Chuy'},b={id:uid(),name:'Lupita'},c={id:uid(),name:'Beto'},d={id:uid(),name:'Mari'};
  var sc=function(w,x,y,z){var o={};o[a.id]=w;o[b.id]=x;o[c.id]=y;o[d.id]=z;return {scores:o}};
  return {players:[a,b,c,d],games:[{id:uid(),name:'Dominó',preset:'domino',win:'high',target:100,phases:false,bet:false,example:true,ended:false,
    players:[a,b,c,d].map(function(p){return {id:p.id,name:p.name}}),rounds:[sc(23,0,8,0),sc(0,31,0,12),sc(17,0,0,26)]}]};
}
function game(){return S.games.find(function(g){return g.id===V.gameId})}
function pname(g,pid){var p=S.players.find(function(p){return p.id===pid});if(p)return p.name;var q=g.players.find(function(p){return p.id===pid});return q?q.name:'?'}
function rpts(g,r,pid){
  if(g.phases)return 0;
  if(g.bet){var b=(r.bids&&r.bids[pid])||0,w=(r.won&&r.won[pid])||0;return b===w?20+10*w:-10*Math.abs(b-w)}
  return (r.scores&&r.scores[pid])||0;
}
function total(g,pid){return g.rounds.reduce(function(a,r){return a+rpts(g,r,pid)},0)}
function phDone(g,pid,skip){return g.rounds.filter(function(r,i){return i!==skip&&r.done&&r.done[pid]}).length}
function standing(g){
  var rows=g.players.map(function(p){return {id:p.id,name:pname(g,p.id),total:total(g,p.id),ph:g.phases?Math.min(10,phDone(g,p.id)):0}});
  var cmp=function(a,b){return g.phases?(b.ph-a.ph):(g.win==='low'?a.total-b.total:b.total-a.total)};
  rows.sort(cmp);
  rows.forEach(function(r,i){r.pos=(i>0&&cmp(rows[i-1],r)===0)?rows[i-1].pos:i+1});
  return rows;
}
function isOver(g){
  if(g.ended)return true;
  if(g.phases)return g.players.some(function(p){return phDone(g,p.id)>=10});
  if(g.target)return g.players.some(function(p){return total(g,p.id)>=g.target});
  return false;
}
function winners(g){return standing(g).filter(function(r){return r.pos===1}).map(function(r){return r.name})}
function joinNames(a){return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' y '+a[a.length-1]}
function rule(g){
  if(g.phases)return 'Gana quien termina primero la fase 10';
  if(g.bet)return 'Apuestas: 20 + 10 por baza si aciertas, −10 por baza de diferencia si fallas';
  var w=g.win==='low'?'Gana el de menos puntos':'Gana el de más puntos';
  return g.target?w+' · termina al llegar a '+fmt(g.target):w;
}

/* ---------- vistas ---------- */
function header(){
  var tab=V.screen==='players'?'players':'home';
  return '<div class="top"><svg width="30" height="52" viewBox="0 0 30 52" aria-hidden="true"><rect x="1.5" y="1.5" width="27" height="49" rx="5" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/><line x1="6" y1="26" x2="24" y2="26" stroke="var(--ink)" stroke-width="2"/><circle cx="9" cy="8.5" r="2.6" fill="var(--ink)"/><circle cx="21" cy="8.5" r="2.6" fill="var(--ink)"/><circle cx="15" cy="14" r="2.6" fill="var(--ink)"/><circle cx="9" cy="19.5" r="2.6" fill="var(--ink)"/><circle cx="21" cy="19.5" r="2.6" fill="var(--ink)"/><circle cx="9" cy="33" r="2.6" fill="var(--felt)"/><circle cx="21" cy="45" r="2.6" fill="var(--felt)"/></svg><h1>Anotador de Juegos</h1></div>'+
  (VIEW?'':'<nav class="tabs"><button data-act="go" data-to="home" aria-current="'+(tab==='home')+'">Partidas</button><button data-act="go" data-to="players" aria-current="'+(tab==='players')+'">Jugadores ('+S.players.length+')</button></nav>')+(syncText()?'<div class="muted" id="sync" style="margin-top:-8px">'+esc(syncText())+'</div>':'');
}
function home(){
  var h='<button class="btn primary big" data-act="new">Nueva partida</button>';
  if(!S.games.length)return h+'<p class="muted">'+(RO?'Esta partida no existe o ya fue borrada. Pide un enlace nuevo a quien anota.':'Todavía no hay partidas. Empieza una arriba.')+'</p>';
  h+='<div class="list">';
  S.games.slice().reverse().forEach(function(g){
    var over=isOver(g),st=over?('Ganó '+joinNames(winners(g))):(g.rounds.length?'Ronda '+g.rounds.length+' jugada':'Sin rondas');

        if(g.phases)h+='<td>'+(r.done&&r.done[p.id]?'Avanzó':'·')+'</td>';

    h+='<td></td></tr></tfoot></table></div></div>';

  return h;

function mod(x,N){return ((x%N)+N)%N}
function turn(g){var N=g.players.length,n=g.rounds.length;return {hand:g.players[mod(n+(g.hs||0),N)].id,deal:g.players[mod(n-1+(g.ds||0),N)].id}}
function turnSheet(){
  var g=game(),tn=turn(g);
  var grp=function(act,cur){var s='<div class="chips">';g.players.forEach(function(p){s+='<button class="chip" data-act="'+act+'" data-id="'+p.id+'" aria-pressed="'+(p.id===cur)+'">'+esc(pname(g,p.id))+'</button>'});return s+'</div>'};
  return '<div class="veil" data-act="closesheet"><div class="sheet"><h3>Ronda '+(g.rounds.length+1)+'</h3>'+
    '<div class="field"><span class="lbl">Tiene la mano</span>'+grp('sethand',tn.hand)+'</div>'+
    '<div class="field"><span class="lbl">Reparte</span>'+grp('setdeal',tn.deal)+'</div>'+
    '<p class="muted" style="margin:0">Al cambiar la mano, el reparto pasa al jugador anterior. Si quieres otro, cámbialo después. Las siguientes rondas siguen rotando desde aquí.</p>'+
    '<button class="btn primary big" data-act="closesheet" data-force="1">Listo</button></div></div>';
}

    }else{
      h+='<button type="button" class="pm" data-act="sign" data-for="s-'+id+'" aria-label="Cambiar signo de '+esc(pname(g,id))+'">±</button><input type="text" inputmode="numeric" id="s-'+id+'" aria-label="Puntos de '+esc(pname(g,id))+'" value="'+(ed&&r.scores&&r.scores[id]?r.scores[id]:'')+'" placeholder="0">';

  });

function confirmView(){
  return '<div class="veil center"><div class="sheet" role="alertdialog" aria-label="Confirmar"><p style="margin:0;font-size:18px;font-weight:600">'+esc(V.confirm.msg)+'</p><div class="row"><button class="btn primary grow" data-act="yes">'+esc(V.confirm.label)+'</button><button class="btn grow" data-act="no">Cancelar</button></div></div></div>';

function render(){
  document.body.classList.toggle('ro',RO);
  if(!S){document.getElementById('app').innerHTML='<div class="top"><h1>Anotador de Juegos</h1></div><p class="muted" id="sync">'+esc(syncText()||'Cargando…')+'</p>';return}
  var body=V.screen==='players'?playersView():V.screen==='new'?newView():V.screen==='game'?gameView():home();
  document.getElementById('app').innerHTML=header()+body+(V.sheet?sheetView():'')+(V.confirm?confirmView():'');
}
function ask(msg,label,fn){V.confirm={msg:msg,label:label,fn:fn};render()}
function newDraft(pid){var p=PRESETS.find(function(x){return x.id===pid});return {preset:p.id,name:p.name,win:p.win,target:p.target?String(p.target):'',sel:[],pmode:'orig'}}

/* ---------- acciones ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  if(RO)return;
  var a=t.dataset.act,g=game(),d=V.draft;
  if(a==='closesheet'){if(t.dataset.force||e.target===t){V.sheet=null;render()}return}
  if(a==='go'){V.screen=t.dataset.to;V.sheet=null;render();window.scrollTo(0,0)}
  else if(a==='new'){V.draft=newDraft('domino');V.screen='new';render();window.scrollTo(0,0)}
  else if(a==='open'){V.gameId=t.dataset.id;V.screen='game';render();window.scrollTo(0,0)}
  else if(a==='preset'){var s=d.sel;V.draft=newDraft(t.dataset.id);V.draft.sel=s;render()}
  else if(a==='win'){d.win=t.dataset.id;render()}
  else if(a==='sel'){var i=d.sel.indexOf(t.dataset.id);if(i>=0)d.sel.splice(i,1);else d.sel.push(t.dataset.id);render()}
  else if(a==='start'){
    if(d.sel.length<2)return;
    var p=PRESETS.find(function(x){return x.id===d.preset}),tg=num(d.target);
    var ng={id:uid()+uid(),name:(d.name||'').trim()||p.name,preset:p.id,win:p.phases?'low':p.bet?'high':d.win,target:(p.phases||p.bet||tg<=0)?null:tg,phases:!!p.phases,bet:!!p.bet,ended:false,rounds:[],
      players:d.sel.map(function(id){var q=S.players.find(function(x){return x.id===id});return {id:id,name:q?q.name:'?'}})};
    if(ng.phases&&d.pmode==='new')ng.pset=newSet();
    S.games.push(ng);save();V.gameId=ng.id;V.screen='game';render();window.scrollTo(0,0);
  }
  else if(a==='round'){V.sheet={i:t.dataset.i!=null?+t.dataset.i:null};render();var f=document.querySelector('.sheet input[type=text]');if(f&&V.sheet.i==null)f.focus()}
  else if(a==='turn'){V.sheet={turn:true};render()}
  else if(a==='sethand'||a==='setdeal'){
    var N=g.players.length,k=g.players.findIndex(function(p){return p.id===t.dataset.id}),rn=g.rounds.length;
    if(a==='sethand'){g.hs=mod(k-rn,N);g.ds=g.hs}else g.ds=mod(k-(rn-1),N);
    save();render();
  }
  else if(a==='pmode'){d.pmode=t.dataset.id;render()}
  else if(a==='reroll'){var ps=phases(g).slice(),lv=+t.dataset.i;ps[lv]=pick(lv,ps[lv]);g.pset=ps;save();render()}
  else if(a==='newphases'){
    var doNew=function(){g.pset=newSet(g.pset);save()};
    if(g.rounds.length)ask('¿Cambiar las 10 fases a media partida? Los avances se conservan.','Cambiar',doNew);else{doNew();render()}
  }
  else if(a==='origphases'){delete g.pset;save();render()}
  else if(a==='copy'){
    var url=t.dataset.url,done=function(){t.textContent='Enlace copiado'},fail=function(){t.textContent=url};
    try{navigator.clipboard.writeText(url).then(done,fail)}catch(err){fail()}
  }
  else if(a==='sign'){var inp=document.getElementById(t.dataset.for),v=inp.value.trim();inp.value=v.charAt(0)==='-'?v.slice(1):'-'+v;inp.focus()}
  else if(a==='delround'){var ix=V.sheet.i;ask('¿Borrar la ronda '+(ix+1)+'?','Borrar',function(){g.rounds.splice(ix,1);V.sheet=null;save()})}
  else if(a==='end'){g.ended=true;save();render()}
  else if(a==='reopen'){g.ended=false;save();render()}
  else if(a==='rematch'){
    var c={id:uid()+uid(),name:g.name,preset:g.preset,win:g.win,target:g.target,phases:g.phases,bet:g.bet,ended:false,rounds:[],players:g.players.map(function(p){return {id:p.id,name:pname(g,p.id)}})};
    if(g.pset)c.pset=g.pset.slice();
    S.games.push(c);save();V.gameId=c.id;render();window.scrollTo(0,0);
  }
  else if(a==='delgame'){var gid=t.dataset.id,gg=S.games.find(function(x){return x.id===gid});ask('¿Borrar la partida "'+gg.name+'"?','Borrar',function(){S.games=S.games.filter(function(x){return x.id!==gid});save()})}
  else if(a==='delplayer'){var pid=t.dataset.id,pp=S.players.find(function(x){return x.id===pid});ask('¿Quitar a '+pp.name+' de la lista? Sus partidas se conservan.','Quitar',function(){
    S.games.forEach(function(x){x.players.forEach(function(q){if(q.id===pid)q.name=pp.name})});
    S.players=S.players.filter(function(x){return x.id!==pid});save()})}
  else if(a==='yes'){var fn=V.confirm.fn;V.confirm=null;fn();render()}
  else if(a==='no'){V.confirm=null;render()}
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  if(RO)return;
  var f=e.target.dataset.form;
  if(f==='addplayer'){
    var inp=e.target.querySelector('input'),nm=inp.value.trim();if(!nm)return;
    var p={id:uid(),name:nm};S.players.push(p);
    if(V.screen==='new')V.draft.sel.push(p.id);
    save();render();var again=document.getElementById('np');if(again)again.focus();
  }else if(f==='round'){
    var g=game(),r={};
    if(g.bet){r.bids={};r.won={};g.players.forEach(function(p){r.bids[p.id]=Math.max(0,num(document.getElementById('b-'+p.id).value));r.won[p.id]=Math.max(0,num(document.getElementById('w-'+p.id).value))})}
    else if(!g.phases){r.scores={};g.players.forEach(function(p){r.scores[p.id]=num(document.getElementById('s-'+p.id).value)})}
    if(g.phases){r.done={};g.players.forEach(function(p){r.done[p.id]=document.getElementById('d-'+p.id).checked})}
    if(V.sheet.i!=null)g.rounds[V.sheet.i]=r;else g.rounds.push(r);
    V.sheet=null;save();render();
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset.draft&&V.draft)V.draft[t.dataset.draft]=t.value;
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.rename&&!RO){var p=S.players.find(function(x){return x.id===t.dataset.rename}),v=t.value.trim();if(p&&v){p.name=v;save()}else if(p){t.value=p.name}}
});

S=load();
connect();
})();
</script>
</body>
